name: Finder — scheduled scrape

# Cloudflare Pages doesn't ship a built-in scheduler, so GitHub Actions runs
# the scrapers on a cron and POSTs them to /api/scraper/[retailer]. The handler
# is idempotent — each row carries a scraped_at timestamp and the view dedupes
# on (sku, retailer_id, pack_size) so repeated calls are safe.
#
# SECRETS REQUIRED (Settings → Secrets and variables → Actions):
#   SCRAPER_ADMIN_TOKEN — same token Cloudflare Pages uses (X-Scraper-Token)
#
# CRON CADENCE
#   Every 6h, on the hour: 02:00, 08:00, 14:00, 20:00 UTC.
#   = 04:00, 10:00, 16:00, 22:00 Berlin local in summer (CEST)
#   That spreads scrapes around the day so we catch morning/afternoon/evening
#   stock churn without hammering retailers more than they'd see a normal user.

on:
  schedule:
    # 6-hour cadence — picks four times daily.
    - cron: "0 2,8,14,20 * * *"
  # Manual trigger for ad-hoc runs from the GitHub UI.
  workflow_dispatch:

# Cancel any in-flight scrape if a new one starts (avoid overlapping writes).
concurrency:
  group: finder-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      # Run retailers in parallel — they hit different domains, no rate-limit risk.
      matrix:
        retailer:
          - de-noblego
          - de-cigarmaxx
          - de-cigarworld
          - ch-cigarmust
          - ch-egmcigars
      # Don't kill the matrix if one retailer fails — we want partial success.
      fail-fast: false
    steps:
      - name: Trigger ${{ matrix.retailer }} scrape (sliced 3-way)
        env:
          SCRAPER_ADMIN_TOKEN: ${{ secrets.SCRAPER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCRAPER_ADMIN_TOKEN:-}" ]; then
            echo "::error::SCRAPER_ADMIN_TOKEN secret is not set"
            exit 1
          fi
          # Each retailer's PDPs are sliced into 3 parts and processed in 3
          # sequential invocations so no single Cloudflare Pages Function call
          # exceeds the subrequest / memory / CPU limits. For retailers with
          # only a handful of PDPs (cigarmust, cigarworld) most slices will
          # process ≤ 4 PDPs each — still cheaper than one big call.
          TOTAL_INSERTED=0
          TOTAL_EXTRACTED=0
          TOTAL_ERRORS=0
          TOTAL_NOTICES=0
          TOTAL_404=0
          TOTAL_PARSER_ZERO=0
          TOTAL_FETCH_EXC=0
          TOTAL_FLOOR=0
          ANY_FAIL=0
          # Collect every HTTP-404 URL across slices so we can list them in the
          # summary — these are the slugs that need cleanup.
          NOT_FOUND_URLS=""
          for SLICE in 0 1 2; do
            echo "→ POST /api/scraper/${{ matrix.retailer }}?slice=$SLICE&total=3"
            response=$(curl -sS -w "\n%{http_code}" \
              -X POST "https://thenextcigar.com/api/scraper/${{ matrix.retailer }}?slice=$SLICE&total=3" \
              -H "X-Scraper-Token: ${SCRAPER_ADMIN_TOKEN}" \
              --max-time 120)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP $http_code · slice $SLICE"
            echo "$body" | head -c 3500
            echo ""
            if [ "$http_code" != "200" ]; then
              echo "::warning::HTTP $http_code on slice $SLICE — continuing other slices"
              ANY_FAIL=1
              continue
            fi
            ins=$(echo "$body" | jq -r '.stats.inserted // 0')
            ext=$(echo "$body" | jq -r '.stats.rowsExtracted // 0')
            err=$(echo "$body" | jq -r '.errors // [] | length')
            not=$(echo "$body" | jq -r '.notices // [] | length')
            s404=$(echo "$body" | jq -r '.stats.pdpsHttp404 // 0')
            spz=$(echo "$body" | jq -r '.stats.pdpsParserZero // 0')
            sfe=$(echo "$body" | jq -r '.stats.pdpsFetchException // 0')
            sfl=$(echo "$body" | jq -r '.stats.offersRejectedByFloor // 0')
            TOTAL_INSERTED=$((TOTAL_INSERTED + ins))
            TOTAL_EXTRACTED=$((TOTAL_EXTRACTED + ext))
            TOTAL_ERRORS=$((TOTAL_ERRORS + err))
            TOTAL_NOTICES=$((TOTAL_NOTICES + not))
            TOTAL_404=$((TOTAL_404 + s404))
            TOTAL_PARSER_ZERO=$((TOTAL_PARSER_ZERO + spz))
            TOTAL_FETCH_EXC=$((TOTAL_FETCH_EXC + sfe))
            TOTAL_FLOOR=$((TOTAL_FLOOR + sfl))
            # Pull just the URLs that returned HTTP 404 — these are slugs to
            # remove from the PDP list in functions/api/scraper/[retailer].ts.
            slice_404=$(echo "$body" | jq -r '.errors[] | select(test(" HTTP 404$"))' || true)
            if [ -n "$slice_404" ]; then
              NOT_FOUND_URLS="${NOT_FOUND_URLS}${slice_404}
"
            fi
          done
          {
            echo "## ${{ matrix.retailer }} (3 slices)"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| rows extracted (total) | $TOTAL_EXTRACTED |"
            echo "| rows inserted (total)  | $TOTAL_INSERTED |"
            echo "| **errors (hard)**      | $TOTAL_ERRORS |"
            echo "| · HTTP 404 (slug to fix)  | $TOTAL_404 |"
            echo "| · parser found 0 offers   | $TOTAL_PARSER_ZERO |"
            echo "| · fetch exception         | $TOTAL_FETCH_EXC |"
            echo "| notices (soft)         | $TOTAL_NOTICES |"
            echo "| · offers under €20 floor  | $TOTAL_FLOOR |"
            echo "| any slice 500'd        | $ANY_FAIL |"
            if [ -n "$NOT_FOUND_URLS" ]; then
              echo ""
              echo "<details><summary>404 URLs to clean up</summary>"
              echo ""
              echo '```'
              printf '%s' "$NOT_FOUND_URLS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ANY_FAIL" = "1" ]; then
            echo "::warning::At least one slice returned non-200 — see logs above"
          fi
          if [ "$TOTAL_INSERTED" -lt 1 ]; then
            echo "::error::Zero rows inserted across all 3 slices"
            exit 1
          fi

  # Once both retailers have written fresh snapshots, diff against the previous
  # round and email subscribers about price_drop / back_in_stock events. We let
  # this fail soft — alerts are best-effort and shouldn't block scraping.
  alerts:
    needs: scrape
    if: always() && needs.scrape.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fire watchlist alerts
        env:
          SCRAPER_ADMIN_TOKEN: ${{ secrets.SCRAPER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCRAPER_ADMIN_TOKEN:-}" ]; then
            echo "::error::SCRAPER_ADMIN_TOKEN secret is not set"
            exit 1
          fi
          echo "→ POST /api/finder/alerts/process"
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://thenextcigar.com/api/finder/alerts/process" \
            -H "X-Scraper-Token: ${SCRAPER_ADMIN_TOKEN}" \
            --max-time 120)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code"
          echo "$body" | head -c 4000
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "::warning::Alert engine returned HTTP $http_code"
            exit 0
          fi
          scanned=$(echo "$body" | jq -r '.watchlistsScanned // 0')
          fired=$(echo "$body" | jq -r '.alertsFired // 0')
          detected=$(echo "$body" | jq -r '.eventsDetected // 0')
          {
            echo "## Alerts"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| watchlists scanned | $scanned |"
            echo "| events detected | $detected |"
            echo "| alerts fired | $fired |"
          } >> "$GITHUB_STEP_SUMMARY"
