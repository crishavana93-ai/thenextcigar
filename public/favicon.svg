<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TNext Cigars">
  <!-- Dark charcoal rounded square so the badge reads clearly on light or dark Chrome tab themes. -->
  <rect width="64" height="64" rx="12" fill="#1a1d2e"/>
  <!-- Gold "TN" monogram in a heavy serif - geometric and chunky so it stays sharp at 16x16. -->
  <text x="32" y="42" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" letter-spacing="-1" text-anchor="middle" fill="#c9a961">TN</text>
  <!-- Gold underline accent so it reads as a wordmark badge. -->
  <rect x="18" y="48" width="28" height="2" fill="#c9a961"/>
</svg>
